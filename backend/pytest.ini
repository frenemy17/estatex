[pytest]
# Two xdist workers with loadscope: each module is pinned to one worker, so
# modules that share a database or an app instance don't race each other.
# Run serially with `-n 0` (not `-p no:xdist`, which errors because addopts
# still passes -n/--dist).
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope -m "not integration"
testpaths = tests
markers =
    integration: needs a live server and/or real provider credentials (deselected by default; run with `-m integration`)
